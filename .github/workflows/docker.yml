name: docker

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Get version (main only)
        id: version
        if: github.ref_name == 'main'
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      # main の merge のみ latest と package.json のバージョンタグを付け、develop は nightly にする
      - name: Compute image tags
        id: tags
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            TAGS="$IMAGE:latest,$IMAGE:$VERSION"
          else
            TAGS="$IMAGE:nightly"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          make_latest: true
          body: |
            CapCut TTS Proxy v${{ steps.version.outputs.version }} のリリースです。
            Release of CapCut TTS Proxy v${{ steps.version.outputs.version }}.
