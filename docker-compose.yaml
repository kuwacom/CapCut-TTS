services:
  capcut-tts:
    image: ghcr.io/kuwacom/capcut-tts:latest
    container_name: capcut-tts
    restart: always
    ports:
      - '8080:8080'
    env_file:
      - .env
    environment:
      PORT: 8080
      # 状態は data/ へ集約して永続化する
      CAPCUT_SESSION_STORE_PATH: data/capcut-session.json
      CAPCUT_BUNDLE_CONFIG_PATH: data/capcut-bundle-config.json
      CAPCUT_SPEAKER_PREVIEW_TEMP_DIR: data/speaker-preview-temp
    volumes:
      - ./data:/app/data
    build:
      context: .
      dockerfile: docker/Dockerfile
